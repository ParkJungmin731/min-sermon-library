<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 설교서재</title>
    <!-- Tailwind CSS for Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js for Local Database -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #FDFBF7; }
        .font-serif { font-family: 'Nanum Myeongjo', serif; }
        .olive-theme { color: #5A6B4A; }
        .bg-olive { background-color: #5A6B4A; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- 사이드바 -->
        <aside class="w-64 bg-[#F5F2EA] border-r border-slate-200 flex flex-col">
            <div class="p-6 text-xl font-serif font-bold text-olive-800 border-b border-slate-200">나의 설교서재</div>
            <nav class="flex-1 p-4 space-y-1">
                <button onclick="router('dashboard')" class="menu-btn w-full text-left px-4 py-2 rounded-md hover:bg-slate-200 transition-colors">📊 대시보드</button>
                <button onclick="router('library')" class="menu-btn w-full text-left px-4 py-2 rounded-md hover:bg-slate-200 transition-colors">📚 내 설교</button>
                <button onclick="router('generator')" class="menu-btn w-full text-left px-4 py-2 rounded-md hover:bg-slate-200 transition-colors">✨ AI 생성</button>
                <button onclick="router('settings')" class="menu-btn w-full text-left px-4 py-2 rounded-md hover:bg-slate-200 transition-colors">⚙️ 설정</button>
            </nav>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-content" class="flex-1 overflow-auto p-8"></main>
    </div>

    <script>
        // 1. 데이터베이스 설정
        const db = new Dexie('SermonDB');
        db.version(1).stores({
            sermons: '++id, title, date, status',
            documents: '++id, sermonId, title'
        });

        // 2. 라우터 (화면 전환)
        function router(page) {
            const content = document.getElementById('main-content');
            if (page === 'dashboard') renderDashboard(content);
            else if (page === 'library') renderLibrary(content);
            else if (page === 'generator') renderGenerator(content);
            else if (page === 'settings') renderSettings(content);
        }

        // 3. 대시보드 화면
        async function renderDashboard(el) {
            const count = await db.sermons.count();
            el.innerHTML = `
                <h1 class="text-3xl font-serif font-bold mb-8">나의 사역 통계</h1>
                <div class="grid grid-cols-3 gap-6 mb-12">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-sm text-slate-500">전체 설교</div>
                        <div class="text-4xl font-bold">${count}편</div>
                    </div>
                    <div class="bg-olive-100 p-6 rounded-xl border border-slate-200 shadow-sm text-center text-olive-900">
                        <div class="text-sm opacity-80">작성 중</div>
                        <div class="text-4xl font-bold">진행 중</div>
                    </div>
                    <div class="bg-olive p-6 rounded-xl shadow-sm text-center text-white">
                        <div class="text-sm opacity-80">완료</div>
                        <div class="text-4xl font-bold">확인 필요</div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <h3 class="text-lg font-bold mb-4">최근 작업</h3>
                    <p class="text-slate-400">작성된 설교가 없습니다. '내 설교'에서 추가해 보세요.</p>
                </div>
            `;
        }

        // 4. 설교 목록 화면
        async function renderLibrary(el) {
            const sermons = await db.sermons.toArray();
            el.innerHTML = `
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-serif font-bold">내 설교 목록</h1>
                    <button onclick="addSermon()" class="bg-olive text-white px-4 py-2 rounded-md hover:bg-olive-800">+ 새 설교 작성</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    ${sermons.map(s => `
                        <div class="p-6 bg-white border border-slate-200 rounded-xl cursor-pointer hover:shadow-md transition-all">
                            <h3 class="text-xl font-serif font-bold mb-2">${s.title}</h3>
                            <div class="text-xs text-slate-400">${s.date} | ${s.status}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function addSermon() {
            const title = prompt('설교 제목을 입력하세요:');
            if (title) {
                await db.sermons.add({ title, date: new Date().toLocaleDateString(), status: 'Idea' });
                router('library');
            }
        }

        // 5. AI 생성 화면
        function renderGenerator(el) {
            el.innerHTML = `
                <h1 class="text-3xl font-serif font-bold mb-8">AI 설교 초안 생성</h1>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-2xl">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">성경 본문</label>
                            <input id="ai-scripture" class="w-full p-2 border rounded" placeholder="예: 로마서 8:1-11">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">설교 의도</label>
                            <textarea id="ai-intent" class="w-full p-2 border rounded h-32" placeholder="어떤 메시지를 전하고 싶으신가요?"></textarea>
                        </div>
                        <button onclick="alert('AI API 키를 설정 메뉴에서 먼저 입력해 주세요!')" class="w-full py-3 bg-olive text-white rounded-lg font-bold">초안 생성 시작</button>
                    </div>
                </div>
            `;
        }

        // 6. 설정 화면
        function renderSettings(el) {
            el.innerHTML = `
                <h1 class="text-3xl font-serif font-bold mb-8">설정</h1>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-md">
                    <label class="block text-sm font-bold mb-2">OpenAI API Key</label>
                    <input id="api-key" class="w-full p-2 border rounded mb-4" placeholder="sk-...">
                    <button onclick="saveSettings()" class="w-full py-2 bg-slate-800 text-white rounded">저장하기</button>
                </div>
            `;
        }

        function saveSettings() {
            const key = document.getElementById('api-key').value;
            localStorage.setItem('ai_api_key', key);
            alert('설정이 저장되었습니다.');
        }

        // 초기 화면 실행
        router('dashboard');
    </script>
</body>
</html>
